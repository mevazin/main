<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Kurb Yolu</title>
</head>
<body>

<style>
/* Layout: one phone-width column like a pocket notebook; bottom tab bar; firuze (Iznik turquoise) accent on cool stone / night indigo. */
:root{
  --bg:#EDF1F2; --surface:#FAFCFC; --sunk:#E3E9EB; --ink:#15223A; --muted:#566377; --line:#D2DBE0;
  --accent:#086A64; --accent-ink:#FFFFFF; --accent-soft:#D5EBE8; --gold:#7A5A16; --gold-soft:#F1E7CF;
  --ok:#2F7A3E; --shadow:0 1px 2px rgba(21,34,58,.06),0 6px 20px rgba(21,34,58,.06);
  --f-display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-ar:"Noto Naskh Arabic","Geeza Pro","Traditional Arabic","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1220; --surface:#141C2D; --sunk:#0F1626; --ink:#E5EBF2; --muted:#9AA7B9; --line:#243049;
  --accent:#3DBFB3; --accent-ink:#06221F; --accent-soft:#143539; --gold:#D6B160; --gold-soft:#2A2616;
  --ok:#6BC07B; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1220; --surface:#141C2D; --sunk:#0F1626; --ink:#E5EBF2; --muted:#9AA7B9; --line:#243049;
  --accent:#3DBFB3; --accent-ink:#06221F; --accent-soft:#143539; --gold:#D6B160; --gold-soft:#2A2616;
  --ok:#6BC07B; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:0 96px}
.wrap{max-width:680px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:1.9rem} h2{font-size:1.4rem} h3{font-size:1.15rem}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.eyebrow{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.ar{font-family:var(--f-ar);direction:rtl;font-size:1.6rem;line-height:1.9;color:var(--gold)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-block:20px 12px}
.brand{display:flex;gap:10px;align-items:center}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font-family:var(--f-display);font-size:1.35rem;display:block;line-height:1}
.brand span{font-size:.8rem;color:var(--muted)}
.top .row{flex-wrap:nowrap;flex:none}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem}
.dates{margin-block:4px 16px}
.dates .g{font-family:var(--f-display);font-size:1.5rem}
.dates .h{color:var(--gold);font-size:.95rem}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.banner{background:var(--accent-soft);border:1px solid transparent;border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:9px 14px;font-weight:700}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{border-color:var(--line);background:var(--surface);color:var(--ink);font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.tag.l1{background:var(--accent-soft);color:var(--accent)}
.tag.l3{background:var(--gold-soft);color:var(--gold)}

/* prayers */
.prayers{display:grid;grid-template-columns:repeat(auto-fit,minmax(56px,1fr));gap:6px}
.prayers button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 2px;font-size:.82rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.prayers button .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.prayers button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.prayers button[aria-pressed="true"] .dot{background:var(--accent);border-color:var(--accent)}

/* loop */
.loop{display:flex;flex-direction:column;gap:0;position:relative}
.step{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;padding-block:6px 18px;position:relative}
.step:not(:last-child)::before{content:"";position:absolute;left:17px;top:40px;bottom:0;width:2px;background:var(--line)}
.step .mark{width:36px;height:36px;display:grid;place-items:center;position:relative}
.step .mark svg{position:absolute;inset:0;width:36px;height:36px}
.step .mark span{position:relative;font-family:var(--f-display);font-weight:700;font-size:.95rem;color:var(--accent)}
.step.done .mark span{color:var(--accent-ink)}
.step .body{min-width:0}
.step h3 small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:.85rem;margin-left:6px}
.lesson-title{font-family:var(--f-display);font-size:1.3rem;font-weight:700;margin-block:6px 6px}
.lesson-text{max-width:65ch}
.evidence{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:4px}
.evidence div{font-size:.86rem;color:var(--muted)}
.evidence b{color:var(--ink);font-weight:500}
.libref{font-family:ui-monospace,"Cascadia Mono",Menlo,monospace;font-size:.78rem;background:var(--sunk);border-radius:5px;padding:1px 5px;color:var(--ink);white-space:nowrap}
textarea,input[type=text],select{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px 12px;resize:vertical}
textarea{min-height:72px}
.private{font-size:.78rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.seg{display:flex;gap:6px;flex-wrap:wrap}

/* path */
.hero-ayah{text-align:center;padding:22px 16px}
.hero-ayah .mean{font-family:var(--f-display);font-style:italic;font-size:1.1rem;max-width:52ch;margin:6px auto 4px}
.moves{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.move{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);min-width:0}
.move b{font-family:var(--f-display);font-size:1.05rem;display:block}
.move span{font-size:.82rem;color:var(--muted)}
.domain{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.domain summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.domain summary::-webkit-details-marker{display:none}
.domain summary h3{font-size:1.08rem}
.meter{display:flex;gap:3px}
.meter i{width:9px;height:9px;border-radius:2px;background:var(--line);transform:rotate(45deg)}
.meter i.on{background:var(--accent)}
.lessons{border-top:1px solid var(--line)}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:var(--sunk)}
.lrow .t{min-width:0}
.tag.unv{background:var(--gold-soft);color:var(--gold)}
ul.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.plist li{display:flex;justify-content:space-between;align-items:center;gap:10px}
ul.plist li span{min-width:0}
.check{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.check.on{background:var(--accent);border-color:var(--accent)}
.check.on::after{content:"";width:6px;height:10px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}

/* library */
.stage h3{margin-bottom:4px}
.book{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.book:last-child{border-bottom:0}
.book .ti{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.status{font-size:.75rem;padding:2px 8px;border-radius:6px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.status.free{background:var(--accent-soft);color:var(--accent)}
.mine{align-self:start;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:.8rem;padding:4px 10px;white-space:nowrap}
.mine[data-s="reading"]{border-color:var(--gold);color:var(--gold)}
.mine[data-s="done"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* guide */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{padding:12px 14px;border-radius:14px;max-width:92%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:48px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5}
.tabs .in{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;max-width:680px;width:100%}
.tabs button{border:0;background:none;border-radius:10px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;color:var(--muted)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

/* sheet */
.sheet{position:fixed;inset:0;background:rgba(8,12,22,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet .panel{background:var(--bg);width:100%;max-width:680px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lab{font-weight:700;font-size:.9rem}
ul.principles{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:.9rem;z-index:20}
section[hidden]{display:none!important}
@media (max-width:420px){.moves{grid-template-columns:1fr}.prayers button{font-size:.74rem}}
.linkbtn{border:0;background:none;padding:2px 0;color:var(--accent);text-decoration:underline;text-underline-offset:2px;font-size:.9rem;font-weight:500}
button.libref{border:0;cursor:pointer}
.refinfo{font-size:.82rem;color:var(--muted);padding-left:8px;border-left:2px solid var(--line)}
.notice{background:var(--gold-soft);border-radius:12px;padding:12px 14px}
.recall{border-style:dashed}
.syncline{font-size:.8rem;color:var(--muted)}
.tagnote{font-size:.8rem;color:var(--gold);align-self:flex-start;max-width:92%}
.cue input{background:var(--surface)}
.lessons-list{display:flex;flex-direction:column;gap:6px}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.step .mark svg{transition:transform .4s}.step.done .mark svg{transform:rotate(45deg)}}
</style>

<div class="wrap">
  <header class="top">

  <main>

    <section id="v-path" hidden></section>
    <section id="v-lib" hidden></section>

</div>

<script>
(() => {
"use strict";
/* ---------- content ---------- */
const DOMAINS = {
  iman:{tr:"İman",en:"Faith"}, ibadet:{tr:"İbadet",en:"Worship"}, kuran:{tr:"Kur'an",en:"Qur'an"},
  sunnet:{tr:"Sünnet ve Siyer",en:"Sunna and Sira"}, kalp:{tr:"Kalp ve Nefis",en:"Heart and Self"},
  ahlak:{tr:"Ahlak ve Dil",en:"Character and Speech"}, is:{tr:"İş ve Rızık",en:"Work and Provision"},
  aile:{tr:"Aile ve Hizmet",en:"Family and Service"}, beden:{tr:"Beden ve Güç",en:"Body and Strength"},

};
const LEVELS = {1:{tr:"Temel",en:"Foundation"},2:{tr:"Gelişen",en:"Growing"},3:{tr:"Derinleşen",en:"Deepening"}};

// ev: [text, libId?]. Hadith numbers follow the common (Abdülbâkî) numbering; verify in the library before teaching.
const L = [
 {id:"niyet",pl:{tr:"Bugün bir işten önce bir an dur ve niyetini içinden söyle.",en:"Before a task today, pause and name your intention silently."},sug:true,d:"kalp",lv:1,
  t:{tr:"Niyet: her şeyin başı",en:"Intention: where every deed begins"},
  b:{tr:"Resûlullah ﷺ amellerin niyetlere göre olduğunu ve herkese niyet ettiğinin karşılığı verileceğini bildirir. Âlimler bu hadisi dinin temel metinlerinden sayar. Çalışmak, yemek, uyumak niyetle ibadete dönüşebilir; niyetsiz ibadet ise alışkanlığa iner. Bu yolun ilk adımı yeni bir şey yapmak değil, yaptığını kimin için yaptığını fark etmektir.",
     en:"The Prophet ﷺ taught that deeds are judged by intentions and each person gets what they intended. Scholars count this hadith among the foundations of the religion. Work, eating and sleep can become worship through intention, while worship done without it slides into habit. The first step on this path is not doing something new but noticing who you are doing it for."},
  ev:[["Buhârî, Bed'ü'l-vahy 1 (no. 1)","HD01"],["Müslim, İmâre 155 (no. 1907)","HD02"],["İbn Receb, Câmiu'l-ulûm ve'l-hikem, 1. hadis","HD06",{tr:"şerh; HD06 klasörünün bu şerhi içerip içermediği sahibi tarafından kontrol edilecek",en:"commentary; whether the HD06 folder holds it is to be checked by the owner"}]],
  r:{tr:"Bugün yapacağın sıradan işlerden hangisi bir niyetle ibadete dönüşebilir?",en:"Which ordinary task today could become worship through intention?"},
  p:{tr:"Üç işten önce bir an dur ve niyetini içinden söyle.",en:"Before three tasks today, pause and name your intention silently."}},
 {id:"farz",d:"ibadet",lv:1,
  t:{tr:"Önce farzlar",en:"The obligations come first"},
  b:{tr:"Kudsî hadiste Allah, kulunun kendisine farz kıldığından daha sevimli bir şeyle yaklaşamayacağını, kulun nafilelerle yaklaşmaya devam ettikçe onu seveceğini bildirir. Yakınlık (kurb) yolu bu sırayla işler: önce farzlar, sonra nafileler. Nafile uğruna farzı ihmal etmek yolu tersine çevirir. Farzların hükmü ve kılınışı için mezhebinin ilmihaline başvur.",
     en:"In a hadith qudsi, Allah says His servant draws near to Him with nothing more beloved than what He made obligatory, and keeps drawing near through voluntary deeds until He loves him. The path of nearness (qurb) runs in that order: obligations first, then voluntary acts. Neglecting an obligation for a voluntary act turns the path upside down. For rulings and practice, use the manual of your school."},
  ev:[["Buhârî, Rikâk 38 (no. 6502)","HD01"],["TDV İlmihal I: İman ve İbadetler","FQ01"],["Nûru'l-Îzâh (Hanefî ibadet el kitabı)","FQ03"]],
  r:{tr:"Farzlardan hangisini en çok erteliyorsun? Seni ne erteletiyor?",en:"Which obligation do you delay most, and what makes you delay it?"},
  p:{tr:"En sık geciktirdiğin vakit için bugün bir hatırlatıcı kur.",en:"Set a reminder today for the prayer you most often delay."}},
 {id:"amentu",d:"iman",lv:1,
  t:{tr:"Âmentü: inancın altı rüknü",en:"The six pillars of faith"},
  b:{tr:"Allah'a, meleklerine, kitaplarına, peygamberlerine, âhiret gününe ve kadere iman. Mâtürîdî–Hanefî gelenek bunu Fıkh-ı Ekber ve Tahâvî Akîdesi gibi metinlerde özetler. Yûnus sûresi velîleri \"iman edip takvâ sahibi olanlar\" diye tanımlar: velî önce doğru inanan kuldur.",
     en:"Faith in Allah, His angels, His books, His messengers, the Last Day and divine decree. The Maturidi–Hanafi tradition summarises this in texts such as al-Fiqh al-Akbar and the Creed of al-Tahawi. Surat Yunus defines the friends of Allah as \"those who believe and are mindful of Him\": a walī is first a servant whose belief is sound."},
  ev:[["Bakara 2:285; Nisâ 4:136","QK02"],["Yûnus 10:62–63","QK02"],["Müslim, Îmân 1 (no. 8)","HD02"],["Tahâvî Akîdesi","AK02"],["İmâm-ı Âzam'ın Beş Eseri","AK01"]],
  r:{tr:"Altı rükünden hangisi günlük kararlarında en az görünüyor?",en:"Which of the six pillars shows up least in your daily decisions?"},
  p:{tr:"Her rüknü kendi sözlerinle bir cümleyle yaz.",en:"Write each pillar in one sentence of your own."}},
 {id:"ihsan",d:"iman",lv:1,
  t:{tr:"İslâm, îman, ihsân",en:"Islam, iman, ihsan"},
  b:{tr:"Cibrîl hadisinde din üç boyutuyla öğretilir: İslâm (amel), îman (inanç) ve ihsân, yani Allah'a O'nu görüyormuş gibi kulluk etmek; sen O'nu görmesen de O seni görür. Bu üçü sana verilecek rütbeler değil, ömür boyu birlikte derinleşen boyutlardır.",
     en:"In the hadith of Jibril the religion is taught in three dimensions: islam (practice), iman (belief) and ihsan, worshipping Allah as though you see Him, for though you do not see Him, He sees you. These are not ranks awarded to you. They are dimensions that deepen together over a lifetime."},
  ev:[["Müslim, Îmân 1 (no. 8)","HD02"],["Buhârî, Îmân 37 (no. 50)","HD01"]],
  r:{tr:"Bugün hangi anında \"O beni görüyor\" bilinci davranışını değiştirirdi?",en:"At which moment today would \"He sees me\" have changed what you did?"},
  p:{tr:"Bir namazın ilk rekâtını bilerek yavaşlat; okuduğunun anlamını hatırla.",en:"Slow down the first rak'a of one prayer and recall the meaning of what you recite."}},
 {id:"devam",d:"ibadet",lv:1,
  t:{tr:"Az ama devamlı",en:"Small but constant"},
  b:{tr:"Hz. Âişe'nin rivayetine göre Allah'a en sevimli amel, az da olsa devamlı olanıdır. Kalıcı değişim büyük başlangıçlarla değil, en kötü gününde bile yapabileceğin küçük amellerle gelir. Bu uygulama bu yüzden seri saymaz: ara verirsen yalnızca geri dönersin.",
     en:"As narrated by Aisha, the deed most beloved to Allah is the one done constantly, even if small. Lasting change comes from small deeds you can keep on your worst day, not from grand starts. That is why this app counts no streaks: if you pause, you simply come back."},
  ev:[["Buhârî, Rikâk 18 (no. 6464)","HD01"],["Müslim, Salâtü'l-müsâfirîn 216 (no. 782)","HD02"]],
  r:{tr:"En yorgun gününde bile yapabileceğin amel hangisi?",en:"Which deed could you keep even on your most tired day?"},
  p:{tr:"O tek küçük ameli seç ve bugün başla.",en:"Choose that one small deed and begin today."}},
 {id:"kuran",pl:{tr:"Kur'an'dan biraz, mealiyle ve yavaşça oku.",en:"Read a little of the Qur'an slowly, with the meaning."},sug:true,d:"kuran",lv:1,
  t:{tr:"Kur'an'la bir gün",en:"A day with the Qur'an"},
  b:{tr:"\"Sizin en hayırlınız Kur'an'ı öğrenen ve öğretendir.\" Kur'an kendini, ayetleri üzerinde düşünülsün diye indirilmiş mübarek bir kitap olarak tanıtır. Az ama anlayarak ve düzenli okumak, çok ama dağınık okumaktan iyidir.",
     en:"\"The best of you are those who learn the Qur'an and teach it.\" The Qur'an describes itself as a blessed book sent down so that people reflect on its verses. Reading a little with understanding, regularly, beats reading a lot at random."},
  ev:[["Buhârî, Fezâilü'l-Kur'ân 21 (no. 5027)","HD01"],["Sâd 38:29","QK02"],["Kur'an Yolu tefsiri","QK03"]],
  r:{tr:"Bugün okuduğun ayetlerden hangisi sana doğrudan hitap ediyordu?",en:"Which verse you read today spoke to you directly?"},
  p:{tr:"Bir sayfayı mealiyle yavaşça oku; bir ayeti Kur'an Yolu'ndan aç.",en:"Read one page slowly with the meaning; look one verse up in the Kur'an Yolu commentary."}},
 {id:"dil",d:"ahlak",lv:1,
  t:{tr:"Dil: ya hayır ya sükût",en:"Speech: good words or silence"},
  b:{tr:"\"Allah'a ve âhiret gününe iman eden ya hayır söylesin ya sussun.\" Hucurât sûresi zannın çoğundan, tecessüsten ve gıybetten sakındırır. Gıybet, kardeşinin hoşlanmayacağı bir şeyi arkasından söylemektir; söylenen doğru olsa bile.",
     en:"\"Whoever believes in Allah and the Last Day, let him speak good or stay silent.\" Surat al-Hujurat warns against much suspicion, spying and backbiting. Backbiting is saying behind someone's back what they would dislike, even when it is true."},
  ev:[["Buhârî, Edeb 31 (no. 6018)","HD01"],["Müslim, Îmân 74 (no. 47)","HD02"],["Hucurât 49:12","QK02"],["Müslim, Birr 70 (no. 2589)","HD02"]],
  r:{tr:"Konuşmanın en çok hangi ortamda kaydığını fark ediyor musun?",en:"Where does your speech tend to slip most?"},
  p:{tr:"Bugün gıybetten sakın: orada olmayan birinin hoşlanmayacağı bir şeyi arkasından söyleme. Bu, danışmana ya da bir zararı bildirmene engel değildir.",en:"Today, avoid backbiting: say nothing behind someone's back that they would dislike. This doesn't stop you seeking advice or reporting harm."}},
 {id:"zikir",d:"kalp",lv:1,
  t:{tr:"Zikir: kalbin huzuru",en:"Remembrance: rest for the heart"},
  b:{tr:"\"Bilesiniz ki kalpler ancak Allah'ı anmakla huzur bulur.\" \"Siz beni anın, ben de sizi anayım.\" Namazlardan sonra otuz üçer tesbih, tahmîd ve tekbîr ile bir tevhid sünnette öğretilmiştir. Zikir sayı yarışı değil, dikkatin Allah'a dönmesidir.",
     en:"\"Truly, in the remembrance of Allah hearts find rest.\" \"Remember Me and I will remember you.\" The Sunna teaches thirty-three each of tasbih, tahmid and takbir after prayer, completed with the words of tawhid. Dhikr is not a counting contest. It is attention turning back to Allah."},
  ev:[["Ra'd 13:28; Bakara 2:152","QK02"],["Müslim, Mesâcid 146 (no. 597)","HD02"],["Nevevî, el-Ezkâr","ZK01"],["Hısnu'l-Müslim","ZK03"]],
  r:{tr:"Günün hangi anında kalbin en dağınık?",en:"At what time of day is your heart most scattered?"},
  p:{tr:"Bir namazdan sonra tesbihatı anlamını düşünerek yap.",en:"After one prayer, do the tasbihat while thinking of their meaning."}},
 {id:"tevbe",d:"kalp",lv:1,
  t:{tr:"Tevbe: dönüş",en:"Tawba: returning"},
  b:{tr:"\"Ey kendilerinin aleyhine haddi aşan kullarım! Allah'ın rahmetinden ümit kesmeyin.\" Nevevî, Riyâzü's-Sâlihîn'in tevbe bâbında şartları sayar: günahı bırakmak, pişman olmak, tekrar etmemeye azmetmek; kul hakkı varsa hakkı sahibine iade etmek ya da helallik almak. Tevbe yolun başında bir kez yapılan iş değil, her gün dönülen kapıdır.",
     en:"\"O My servants who have wronged yourselves, do not despair of Allah's mercy.\" In the chapter on repentance of Riyad al-Salihin, al-Nawawi lists its conditions: leaving the sin, regret, and resolving not to return; and where another person's right is involved, restoring it or seeking their pardon. Tawba is not done once at the start of the path. It is the door you return through every day."},
  ev:[["Zümer 39:53; Tahrîm 66:8","QK02"],["Nevevî, Riyâzü's-Sâlihîn, Tevbe bâbı","HD05"]],
  r:{tr:"Dönmek istediğin bir alışkanlık var mı? Buraya yazman gerekmiyor.",en:"Is there a habit you want to turn back from? You don't need to write it here."},
  p:{tr:"Sessiz bir yerde istiğfar et. Birinin hakkı sende kaldıysa, nasıl iade edeceğini planla.",en:"Ask forgiveness somewhere quiet. If you owe someone a right, plan how to return it."}},
 {id:"emanet",d:"is",lv:1,
  t:{tr:"İş bir emanettir",en:"Work is a trust"},
  b:{tr:"\"Allah size emanetleri ehline vermenizi emreder.\" \"Ölçüde ve tartıda hile yapanların vay haline.\" Ölçü yalnız terazi değildir; ücret karşılığında verdiğin zaman ve emek de ölçüdür. Beyaz yakalı çalışan için emanet; mesai, bilgi, şirket kaynakları ve sana güvenen iş arkadaşlarıdır.",
     en:"\"Allah commands you to render trusts to those they are due.\" \"Woe to those who give short measure.\" Measure is not only the scale: the time and effort you give for a wage are measured too. For an office worker the trust includes working hours, information, company resources and the colleagues who rely on you."},
  ev:[["Nisâ 4:58; Mutaffifîn 83:1–3","QK02"],["TDV İlmihal II: İslâm ve Toplum","FQ01"]],
  r:{tr:"İşinde \"eksik tartı\" olabilecek bir alışkanlığın var mı?",en:"Is there a habit at work that could be \"short measure\"?"},
  p:{tr:"Söz verdiğin bir işi söz verdiğin kaliteyle ve zamanında teslim et.",en:"Deliver one task you promised at the quality and time you promised."}},
 {id:"aile",d:"aile",lv:1,
  t:{tr:"Ailesine en hayırlı olan",en:"Best to their family"},
  b:{tr:"\"Sizin en hayırlınız ailesine karşı en hayırlı olanınızdır; ben de aileme karşı en hayırlınızım.\" Hz. Âişe, Resûlullah'ın ﷺ evde ailesinin işlerine yardım ettiğini, namaz vakti girince namaza çıktığını anlatır. Aile; anne-baba, kardeş, eş, çocuk, hayatında kim varsa odur.",
     en:"\"The best of you are those best to their families, and I am the best of you to my family.\" Aisha described how the Prophet ﷺ helped with the housework and went out when the prayer time came. Family here means whoever is in your life: parents, siblings, spouse, children."},
  ev:[["Tirmizî, Menâkıb 63 (no. 3895)","HD03"],["Buhârî, Ezân 44 (no. 676)","HD01"]],
  r:{tr:"Evdekiler senin hangi hâlini en çok görüyor?",en:"Which version of you do the people at home see most?"},
  p:{tr:"Evde senden istenmeden bir iş yap.",en:"Do one job at home without being asked."}},
 {id:"beden",d:"beden",lv:1,
  t:{tr:"Bedeninin senin üzerinde hakkı var",en:"Your body has a right over you"},
  b:{tr:"Geceleri hep namaz kılıp gündüzleri hep oruç tutmak isteyen Abdullah b. Amr'a Resûlullah ﷺ, bedeninin, gözünün ve eşinin onun üzerinde hakkı olduğunu söyledi. Bu yolda aşırılık da bir sapmadır; uyku, hareket ve beslenme ibadeti taşıyan emanetlerdir.",
     en:"When Abdullah b. Amr wanted to pray every night and fast every day, the Prophet ﷺ told him that his body, his eyes and his wife each had a right over him. Excess is also a way of leaving the path. Sleep, movement and food are trusts that carry your worship."},
  ev:[["Buhârî, Savm 55 (no. 1975)","HD01"]],
  r:{tr:"Bedenine karşı en çok hangi hakkı ihmal ediyorsun?",en:"Which of your body's rights do you neglect most?"},
  p:{tr:"Bu gece telefonu bırakacağın saati belirle ve ona uy.",en:"Decide the time you'll put your phone down tonight, and keep it."}},
 {id:"siyer",pl:{tr:"Bir siyer kitabından biraz oku; taklit edebileceğin bir alışkanlığını fark et.",en:"Read a little of a sira and notice one habit of his you could imitate."},sug:true,d:"sunnet",lv:1,
  t:{tr:"Güzel örnek",en:"The beautiful example"},
  b:{tr:"\"Andolsun, Allah'ın Resûlünde sizin için güzel bir örnek vardır.\" Hz. Âişe'ye onun ahlakı sorulduğunda \"Onun ahlakı Kur'an'dı\" dedi. \"De ki: Allah'ı seviyorsanız bana uyun ki Allah da sizi sevsin.\" Bu yol, Resûlullah'ı ﷺ tanımak ve sevmekle yürünür.",
     en:"\"In the Messenger of Allah you have a beautiful example.\" Asked about his character, Aisha said: \"His character was the Qur'an.\" \"Say: if you love Allah, follow me, and Allah will love you.\" This path is walked by coming to know and love the Prophet ﷺ."},
  ev:[["Ahzâb 33:21; Âl-i İmrân 3:31","QK02"],["Müslim, Salâtü'l-müsâfirîn 139 (no. 746)","HD02"],["Hamîdullah, İslâm Peygamberi","SR02"],["Tirmizî, Şemâil (Kandemir şerhi)","SR04"]],
  r:{tr:"Onun hangi alışkanlığı senin hayatında en uzak duruyor?",en:"Which of his habits is furthest from your life right now?"},
  p:{tr:"İslâm Peygamberi'nden bir bölüm oku; taklit edebileceğin bir alışkanlığını not et.",en:"Read one chapter of a sira and note one habit of his you can imitate."}},
 {id:"muhasebe",pl:{tr:"Bu akşam istersen bir şükür ve yarın için bir niyet düşün.",en:"Tonight, if you like, think of something to be thankful for and an intention for tomorrow."},sug:true,d:"kalp",lv:2,
  t:{tr:"Hesaba çekilmeden önce",en:"Before you are called to account"},
  b:{tr:"\"Ey iman edenler! Allah'tan sakının ve herkes yarın için ne hazırladığına baksın.\" Hz. Ömer'e nisbet edilen söz: \"Hesaba çekilmeden önce kendinizi hesaba çekin.\" Muhasebe kendini mahkûm etmek değil; şükredilecek ve düzeltilecek olanı görüp yarına niyet etmektir. Bu uygulamanın akşam bölümü bu yüzden puan vermez.",
     en:"\"O you who believe, be mindful of Allah, and let every soul look to what it has sent ahead for tomorrow.\" A saying attributed to Umar: \"Take yourselves to account before you are taken to account.\" Self-review is not self-condemnation. It is seeing what to be grateful for and what to mend, then intending better for tomorrow. That is why the evening review here gives no score."},
  ev:[["Haşr 59:18","QK02"],["Tirmizî, Kıyâme 25 (no. 2459'un ardından)","HD03"],["Gazzâlî, İhyâ, Murâkabe ve muhasebe kitabı","TS01"]],
  r:{tr:"Muhasebe sende daha çok suçluluk mu, yoksa yön mü üretiyor?",en:"Does self-review produce more guilt in you, or more direction?"},
  p:{tr:"Bu akşam üç dakika: bir şükür, bir istiğfar, yarın için bir niyet.",en:"Tonight, three minutes: one thanks, one plea for forgiveness, one intention for tomorrow."}},
 {id:"malayani",d:"ahlak",lv:2,
  t:{tr:"Mâlâyânî ve ekran",en:"What doesn't concern you, and screens"},
  b:{tr:"\"Kişinin, kendisini ilgilendirmeyeni terk etmesi, İslâm'ının güzelliğindendir.\" Bugün mâlâyâninin en geniş kapısı ekranlardır: bitmeyen akış, başkalarının hayatı, faydasız tartışma. Terk etmek tamamen kopmak değil, faydası olmayanı seçerek bırakmaktır.",
     en:"\"Part of the excellence of a person's Islam is leaving what does not concern him.\" Today the widest door to such distraction is the screen: endless feeds, other people's lives, pointless arguments. Leaving it does not mean cutting yourself off. It means choosing to drop what brings no benefit."},
  ev:[["Tirmizî, Zühd 11 (no. 2317)","HD03"],["Nevevî, Kırk Hadis, 12","HD06"]],
  r:{tr:"Günde ne kadar zamanın, seni ilgilendirmeyen şeylere gidiyor?",en:"How much of your day goes to things that don't concern you?"},
  p:{tr:"Seni en çok oyalayan uygulamayı bugün ana ekrandan kaldır.",en:"Move the app that distracts you most off your home screen today."}},
 {id:"sukur",d:"kalp",lv:2,
  t:{tr:"Şükür",en:"Gratitude"},
  b:{tr:"\"Şükrederseniz elbette size artırırım.\" \"İnsanlara teşekkür etmeyen Allah'a şükretmez.\" Şükür; nimeti fark etmek, kalben Allah'tan bilmek, dille söylemek ve nimeti O'nun rızasına uygun kullanmaktır. Gazzâlî İhyâ'da sabır ve şükrü tek kitapta birlikte işler.",
     en:"\"If you are grateful, I will surely give you more.\" \"Whoever does not thank people does not thank Allah.\" Gratitude means noticing a blessing, knowing in the heart it is from Allah, saying so, and using it as He would be pleased. Al-Ghazali treats patience and gratitude together in one book of the Ihya."},
  ev:[["İbrâhîm 14:7","QK02"],["Ebû Dâvûd, Edeb 11 (no. 4811); Tirmizî, Birr 35 (no. 1954)","HD03"],["Gazzâlî, İhyâ, Sabır ve şükür kitabı","TS01"]],
  r:{tr:"Alıştığın için artık fark etmediğin bir nimet hangisi?",en:"Which blessing have you stopped noticing because you're used to it?"},
  p:{tr:"Bugün bir kişiye, yaptığı belirli bir şey için adıyla teşekkür et.",en:"Thank one person today, by name, for something specific they did."}},
 {id:"sabir",pl:{tr:"Bugün öfkelendiğinde cevap vermeden önce kısa bir an dur.",en:"When you get angry today, pause briefly before you reply."},sug:true,d:"kalp",lv:2,
  t:{tr:"Sabır ilk sarsıntıdadır",en:"Patience is at the first blow"},
  b:{tr:"Resûlullah ﷺ bir kabrin başında ağlayan kadına sabrı tavsiye etti; kadın onu tanımadan ters karşılık verdi, sonra gelip özür diledi. Buyurdu: \"Sabır, musibetin ilk anındadır.\" Sabır duyguyu bastırmak değil; o ilk anda Allah'ın razı olmayacağı söz ve davranıştan kendini tutmaktır.",
     en:"The Prophet ﷺ advised patience to a woman weeping at a grave. Not recognising him, she answered sharply, then later came to apologise. He said: \"Patience is at the first blow.\" Patience is not suppressing feeling. It is holding yourself back, in that first moment, from words and acts Allah would not be pleased with."},
  ev:[["Buhârî, Cenâiz 32 (no. 1283)","HD01"],["Bakara 2:153–157","QK02"]],
  r:{tr:"Senin \"ilk anın\" genelde nasıl geçer?",en:"What does your \"first moment\" usually look like?"},
  p:{tr:"Bugün öfkelendiğinde cevabını bir dakika geciktir.",en:"When you get angry today, delay your reply by one minute."}},
 {id:"helal",d:"is",lv:1,
  t:{tr:"Helal kazanç",en:"Lawful earning"},
  b:{tr:"\"Hiç kimse elinin emeğinden daha hayırlı bir yiyecek yememiştir.\" Kazancın helalliği ibadetin ve duanın zeminidir. Ücret, faiz, borç ve ortaklık gibi konular mezheplerde ayrıntılı işlenir; kendi durumun için bir âlime danış. İktisat kaynakları IEF Kütüphanesi'ndedir.",
     en:"\"No one has eaten better food than what they earned with their own hands.\" Lawful income is the ground that worship and prayer stand on. Wages, interest, debt and partnership are treated in detail by the schools; ask a scholar about your own case. Economics sources live in your IEF Library."},
  ev:[["Buhârî, Büyû' 15 (no. 2072)","HD01"],["TDV İlmihal II","FQ01"],["Zuhaylî, el-Fıkhu'l-İslâmî (karşılaştırmalı)","FQ12"]],
  r:{tr:"Kazancında içini rahatsız eden bir nokta var mı?",en:"Is there anything about your income that unsettles you?"},
  p:{tr:"Bir âlime sorman gereken soruyu açıkça yaz.",en:"Write down, plainly, the question you need to ask a scholar."}},
 {id:"rapor",d:"is",lv:2,
  t:{tr:"Islak buğday yığını",en:"The wet heap of grain"},
  b:{tr:"Resûlullah ﷺ bir buğday yığınına elini sokup altının ıslak olduğunu görünce \"Aldatan bizden değildir\" buyurdu. Üstü iyi görünüp altı eksik olan bir rapor da ıslak buğday yığınıdır. Doğruluk bazen bedel ister; güvenli bir sonraki adım düşün: rakamı düzelt, varsayımı açıkça yaz, gerekirse yöneticinle konuş.",
     en:"The Prophet ﷺ put his hand into a heap of grain, found it wet underneath, and said: \"Whoever cheats is not of us.\" A report that looks fine on top but is hollow underneath is the same wet heap. Honesty can cost something, so plan a safe next step: correct the figure, state the assumption, and raise it with your manager if needed."},
  ev:[["Müslim, Îmân 164 (no. 102)","HD02"]],
  r:{tr:"İşinde \"altı ıslak\" kalmış bir şey var mı?",en:"Is anything in your work wet underneath?"},
  p:{tr:"Göndereceğin bir raporda bir rakamı kaynağıyla karşılaştır.",en:"Check one figure in a report you're about to send against its source."}},
 {id:"hediye",d:"is",lv:2,
  t:{tr:"Hediye mi, görev mi?",en:"A gift, or part of the job?"},
  b:{tr:"Zekât toplamaya gönderilen bir görevli dönünce \"Bu sizin, bu da bana hediye edildi\" dedi. Resûlullah ﷺ, evinde otursaydı o hediyenin ona gelip gelmeyeceğini sordu. Görev sebebiyle gelen hediye görevin emanetine dahildir. Kurum politikan için şirketinin etik birimine, dinî hüküm için bir âlime danış.",
     en:"An official sent to collect zakat came back saying: \"This is yours, and this was given to me as a gift.\" The Prophet ﷺ asked whether the gift would have come had he sat at home. A gift that comes because of your position belongs to the trust of that position. Ask your company's ethics function about policy, and a scholar about the ruling."},
  ev:[["Buhârî, Ahkâm 24 (no. 7174)","HD01"],["Müslim, İmâre 26 (no. 1832)","HD02"]],
  r:{tr:"Bu işte olmasaydın sana hangi hediyeler gelmezdi?",en:"Which gifts would stop if you left this job?"},
  p:{tr:"Şirketinin hediye politikasını oku; aldığın bir hediye varsa bildir.",en:"Read your company's gift policy, and declare any gift you've received."}},
 {id:"guclu",pl:{tr:"Ertelediğin faydalı bir işe küçük bir başlangıç yap.",en:"Make a small start on a useful task you've been putting off."},sug:true,d:"beden",lv:2,
  t:{tr:"Güçlü mümin",en:"The strong believer"},
  b:{tr:"\"Güçlü mümin, zayıf müminden daha hayırlı ve Allah'a daha sevimlidir; her birinde hayır vardır. Sana fayda verecek şeye hırslı ol, Allah'tan yardım iste ve âciz olma.\" Güç beden, bilgi, irade ve beceri olarak anlaşılabilir.",
     en:"\"The strong believer is better and more beloved to Allah than the weak believer, and there is good in both. Be keen on what benefits you, seek Allah's help, and do not give up.\" Strength can mean body, knowledge, will and skill."},
  ev:[["Müslim, Kader 34 (no. 2664)","HD02"]],
  r:{tr:"Hangi alanda \"âciz olma\" emri sana hitap ediyor?",en:"Where does \"do not give up\" speak to you?"},
  p:{tr:"Ertelediğin faydalı bir işin ilk on dakikasını bugün yap.",en:"Do the first ten minutes of a useful task you've been putting off."}},
 {id:"hizmet",pl:{tr:"Bu hafta karşılık beklemeden birine yardım et.",en:"This week, help someone without expecting anything back."},sug:true,d:"aile",lv:2,
  t:{tr:"Kardeşinin yardımında",en:"In your brother's help"},
  b:{tr:"\"Kul, kardeşinin yardımında olduğu sürece Allah da onun yardımındadır.\" Hizmet, bu yolun görünmeyen yüzüdür. Tasavvuf klasikleri hizmeti nefis terbiyesinin temel yollarından biri olarak anlatır.",
     en:"\"Allah is in the help of His servant as long as the servant is in the help of his brother.\" Service is the unseen face of this path. The classics of tasawwuf describe it as one of the main ways the self is trained."},
  ev:[["Müslim, Zikir 38 (no. 2699)","HD02"],["Kuşeyrî Risâlesi","TS02"]],
  r:{tr:"Kimin yardımına ihtiyacı olduğunu biliyorsun ama görmezden geliyorsun?",en:"Whose need do you know about but keep overlooking?"},
  p:{tr:"Bu hafta karşılık beklemeden birine bir saat ayır.",en:"This week, give someone an hour without expecting anything back."}},
 {id:"tevekkul",d:"iman",lv:2,
  t:{tr:"Bağla ve tevekkül et",en:"Tie it, then trust"},
  b:{tr:"\"Kim Allah'tan sakınırsa Allah ona bir çıkış yolu açar… Kim Allah'a tevekkül ederse O ona yeter.\" Devesini bağlamadan tevekkül ettiğini söyleyen kişiye \"Onu bağla ve tevekkül et\" buyrulmuştur. Tevekkül, sebebe sarılıp sonucu Allah'a bırakmaktır.",
     en:"\"Whoever is mindful of Allah, He makes a way out for him… and whoever relies on Allah, He is enough for him.\" To a man who left his camel untied in the name of trust, the Prophet ﷺ said: \"Tie it and rely on Allah.\" Trust means taking the means and leaving the outcome to Allah."},
  ev:[["Talâk 65:2–3","QK02"],["Tirmizî, Kıyâme 60 (no. 2517)","HD03"]],
  r:{tr:"Hangi kaygında sebebi ihmal ediyorsun, hangisinde sonucu bırakamıyorsun?",en:"In which worry are you neglecting the means, and in which can you not let go of the outcome?"},
  p:{tr:"Bir kaygın için yapabileceğin son adımı yap; sonucu duada bırak.",en:"Take the last step you can on one worry, then leave the result in du'a."}},
 {id:"olum",d:"ahiret",lv:1,
  t:{tr:"Ölümü hatırlamak",en:"Remembering death"},
  b:{tr:"\"Lezzetleri yok edeni, ölümü çok anın.\" Akıllı kişi, nefsini hesaba çeken ve ölümden sonrası için çalışandır. Ölümü hatırlamak karamsarlık değil, önceliklerin netleşmesidir.",
     en:"\"Remember often the destroyer of pleasures: death.\" The wise one is he who takes himself to account and works for what comes after death. Remembering death is not gloom. It is clarity about priorities."},
  ev:[["Tirmizî, Zühd 4 (no. 2307)","HD03"],["Tirmizî, Kıyâme 25 (no. 2459)","HD03",{tr:"\"akıllı kişi\" rivayeti: derecesi HD03'te kontrol edilecek",en:"the \"wise one\" report: grading to be checked in HD03"}]],
  r:{tr:"Bu hafta son haftan olsaydı neyi farklı yapardın?",en:"If this were your last week, what would you do differently?"},
  p:{tr:"Bir borcunu öde, ödünç aldığın bir şeyi iade et ya da vasiyet notlarını güncelle.",en:"Pay a debt, return something borrowed, or update your will notes."}},
 {id:"muhabbet",pl:{tr:"Bir namazdan sonra Peygamber'e ﷺ salavat getir.",en:"After a prayer, send blessings on the Prophet ﷺ."},sug:true,d:"kalp",lv:3,
  t:{tr:"Sevgi ve salavat",en:"Love and blessings on the Prophet"},
  b:{tr:"\"Allah onları sever, onlar da Allah'ı sever.\" Nafile hadisi yakınlığın sonunu sevgiyle anlatır. Resûlullah ﷺ, kendisine bir salavat getirene Allah'ın on rahmet edeceğini bildirir. Kütüphanendeki Delâilü'l-Hayrât (ZK04) klasik bir salavat derlemesidir.",
     en:"\"He loves them and they love Him.\" The hadith of voluntary deeds describes the end of nearness as love. The Prophet ﷺ said that whoever sends one blessing on him, Allah sends ten upon them. Dala'il al-Khayrat in your library (ZK04) is a classic collection of such blessings."},
  ev:[["Mâide 5:54","QK02"],["Müslim, Salât 70 (no. 408)","HD02"],["Delâilü'l-Hayrât","ZK04"]],

 pathIntro:{tr:"Ehl-i sünnete göre velî; iman eden, farzları gözeten, nafilelerle Allah'a yaklaşan ve istikamet üzere yaşayan kuldur. Velîlik bir makam olarak ilan edilmez, ölçülmez ve kimse kendisi için iddia etmez; hiçbir velî bir peygamberin derecesine ulaşamaz (Tahâvî Akîdesi). Bu uygulama sana makam vermez. Yolu, geleneğin tarif ettiği sırayla yürümene yardım eder.",en:"In Sunni teaching a walī is a servant who believes, keeps the obligations, draws near to Allah through voluntary deeds and lives with steadfastness. Friendship with Allah is not announced as a rank, not measured, and not claimed for oneself; and no walī reaches the rank of a prophet (Creed of al-Tahawi). This app gives you no rank. It helps you walk the path in the order the tradition describes."},

 principles:{tr:["Velâyet, ihlâs, takvâ ya da nefis makamı için puan, rütbe veya seviye yoktur.","Seri sayacı, liderlik tablosu ve biriken görev borcu yoktur. Ara verirsen sadece dönersin.","Farzlar, uygulamanın isteğe bağlı hedeflerinden ayrı tutulur.","Tefekkür ve muhasebe isteğe bağlıdır, not verilmez ve Rehber'e gönderilmez.","Mezhep görüşleri adıyla verilir; tek görüş bütün İslam adına sunulmaz.","İslami içerik yalnız SLM Kütüphanen'deki eserlerden gelir; öğrenme psikolojisi, tasarım gibi diğer konular her kaynaktan olabilir.","Kaynaklar henüz bir insan tarafından baskıyla karşılaştırılmadı: hepsi \"doğrulanmadı\" olarak gösterilir. Hadis numaraları yaygın numaralamadır, kontrol edilmedi.","Bu uygulama bir hocanın, bir âlimin ya da gerektiğinde bir uzmanın yerine geçmez."],en:["There are no points, ranks or levels for friendship with Allah, sincerity, piety or stations of the self.","No streak counter, no leaderboard, no pile of overdue tasks. If you pause, you simply return.","The obligations are kept apart from the app's optional goals.","Reflection and review are optional, never graded, and never sent to the Guide.","Rulings are given with the name of the school; no single view is presented as all of Islam.","Islamic content comes only from works in your SLM Library; other topics, like the psychology of learning or design, may come from any source.","No source has yet been checked against its edition by a person, so all are shown as unverified. Hadith numbers use the common numbering, unchecked.","This app does not replace a teacher, a scholar, or when needed a professional."]},

/* ---------- state & storage ---------- */
// Inside Mevazin the Prayers tab owns salah tracking, so the prayer marks stay hidden here.
const EMBED = new URLSearchParams(location.search).has("embed");
const PFX="kurb-yolu:", LSK=PFX+"v1", MK=PFX+"marks", BK=PFX+"backup";
const pad=n=>String(n).padStart(2,"0");
const dayKey = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayKey = () => dayKey(new Date());
const addDays = (key,n) => { const [y,m,d]=key.split("-").map(Number); return dayKey(new Date(y,m-1,d+n)); };
function daysBetween(a,b){ const [y1,m1,d1]=a.split("-").map(Number),[y2,m2,d2]=b.split("-").map(Number); return Math.round((Date.UTC(y2,m2-1,d2)-Date.UTC(y1,m1-1,d1))/864e5); }
const DEF_PROFILE = {name:"",stage:"adult",madhhab:"open",focus:[],lang:"en",langManual:false,guideOk:false,practices:[],cues:{},prayerCheck:false,onboarded:false,introSeen:false,lighter:false,recall:false,startHere:false,lastVisit:null,updatedAt:0};
const DEF_PROGRESS = () => ({studied:{},practice:{},books:{},lastOffered:{},recallN:{},updatedAt:0});
function newDay(){return {date:todayKey(),lesson:null,reflect:"",commit:false,kept:null,result:null,shukr:"",niyet:"",instead:"",recall:null,recallDone:false,updatedAt:0};}
let S = {profile:{...DEF_PROFILE}, progress:DEF_PROGRESS(), today:newDay(), days:{}};
let M = {date:todayKey(),prayers:{},na:false,istighfar:false};
let prevVisit=null, mode="local", DB=null, UID=null, tab="today", cloudSeen=false, wiping=false, syncState="local", libAll=false, pendingConflict=null;
const LEGACY_MARKS=["prayers","na","istighfar"];
const scrub = o => { if(o&&typeof o==="object"){ for(const k of LEGACY_MARKS) delete o[k]; } return o; };

function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||"null");}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}
function lsDelPrefix(){try{const ks=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(PFX))ks.push(k);}ks.forEach(k=>localStorage.removeItem(k));}catch(e){}}
function trimDays(){ if(mode!=="db") return; const ks=Object.keys(S.days).sort(); while(ks.length>120){ delete S.days[ks.shift()]; } }
let saveFailShown=false;
function lsWrite(){ if(wiping) return; trimDays(); const ok=lsSet(LSK,{profile:S.profile,progress:S.progress,today:S.today,days:S.days,conflict:pendingConflict}); if(!ok && !saveFailShown){ saveFailShown=true; setTimeout(()=>toast(T(UI.saveFail)),0); } if(ok) saveFailShown=false; return ok; }
function marksLoad(){ const m=lsGet(MK); if(m && m.date!==todayKey()){ try{localStorage.removeItem(MK);}catch(e){} } M = (m && m.date===todayKey()) ? {date:m.date,prayers:m.prayers||{},na:!!m.na,istighfar:!!m.istighfar} : {date:todayKey(),prayers:{},na:false,istighfar:false}; }
function marksSave(){ if(!wiping) lsSet(MK,M); }

function migratePractices(arr){
  return (arr||[]).map(x=>{
    if(x && typeof x==="object" && (x.id||x.text)) return x.id&&LBY[x.id]?{id:x.id}:{text:String(x.text||"")};
    const s=String(x||""); const hit=L.find(l=>l.p.tr===s||l.p.en===s||(l.pl&&(l.pl.tr===s||l.pl.en===s)));
    return hit?{id:hit.id}:{text:s};
  }).filter((x,i,a)=>(x.id||x.text) && a.findIndex(y=>(y.id||"")===(x.id||"")&&(y.text||"")===(x.text||""))===i);
}
function normProfile(p){ const o={...DEF_PROFILE,...(p||{})}; o.practices=migratePractices(o.practices); o.cues=o.cues||{}; return o; }
function normProgress(g){ const o={...DEF_PROGRESS(),...(g||{})}; ["studied","practice","books","lastOffered","recallN"].forEach(k=>{if(!o[k]||typeof o[k]!=="object")o[k]={};}); return o; }
function normDay(d){ const o={...newDay(),...scrub({...(d||{})})}; return o; }
function applyLoaded(o){
  if(!o) return;
  if(o.profile){ S.profile=normProfile(o.profile); if(o.profile.prayerCheck===undefined && o.profile.onboarded) S.profile.prayerCheck=true; }
  if(o.progress) S.progress=normProgress(o.progress);
  if(o.days && typeof o.days==="object"){ S.days={}; for(const [k,v] of Object.entries(o.days)) S.days[k]=normDay(v); }
  if(o.conflict && o.conflict.cloud && o.conflict.local && o.conflict.local.date===todayKey()) pendingConflict={cloud:normDay(o.conflict.cloud),local:normDay(o.conflict.local)};
  if(o.today){
    const t=normDay(o.today);
    if(t.date===todayKey()) S.today=t; else { if(hasContent(t)) S.days[t.date]=t; S.today=newDay(); }
  }
}
const hasContent = d => !!(d && ((d.reflect||"").trim()||(d.shukr||"").trim()||(d.niyet||"").trim()||(d.instead||"").trim()||d.commit));
const coll = () => DB.collection("data/users/"+UID);
let saveTimer=null, dirty=new Set();
function stamp(w){ const t=Date.now(); if(w==="profile")S.profile.updatedAt=t; else if(w==="progress")S.progress.updatedAt=t; else if(w==="today")S.today.updatedAt=t; }
function save(which,quiet){
  if(wiping) return;
  // quiet saves (app-chosen lesson, recall bookkeeping) are not user edits, so they carry no new timestamp
  (Array.isArray(which)?which:[which]).forEach(w=>{dirty.add(w); if(!quiet) stamp(w);});
  lsWrite(); notifyAct();
  if(mode!=="db"){ syncState="local"; updateSync(); return; }
  clearTimeout(saveTimer);
  saveTimer=setTimeout(flush,500);
}
async function flush(){
  clearTimeout(saveTimer); saveTimer=null;
  if(mode!=="db"||wiping||!dirty.size) return;
  const ws=[...dirty]; dirty.clear(); let ok=true;
  for(const w of ws){
    try{
      if(w==="profile") await coll().doc("profile").set(S.profile);
      else if(w==="progress") await coll().doc("progress").set(S.progress);
      else if(w==="today"){ if(pendingConflict){ continue; } await coll().doc("d-"+S.today.date).set(S.today); }
    }catch(e){ ok=false; dirty.add(w); }
  }
  if(wiping) return;
  syncState = ok?"ok":"fail"; updateSync();
  if(!ok){ clearTimeout(saveTimer); saveTimer=setTimeout(flush,15000); }
}
function updateSync(){ const el=$("#syncLine"); if(el) el.textContent=syncText(); }
const syncText = () => mode==="db" ? (syncState==="fail"?T(UI.syncFail):syncState==="ok"?T(UI.syncOk):T(UI.syncLocal)) : T(UI.syncLocal);

async function listAll(){ const snap=await coll().get(); return snap.docs.filter(d=>d.exists); }
async function connect(){
  const cl = window.claude;
  if(!cl || !cl.use) return;
  try{
    const [db,user] = await Promise.all([cl.use("db"),cl.use("user")]);
    const id = user ? await user.id() : null;
    if(!db || !id) return;
    DB=db; UID=id;
    let docs=null;
    try{ docs=await listAll(); }catch(e){ docs=null; }
    const byId={};
    if(docs) docs.forEach(d=>byId[d.id]=d.data());
    else { const [p,g,t]=await Promise.all([coll().doc("profile").get(),coll().doc("progress").get(),coll().doc("d-"+todayKey()).get()]); if(p.exists)byId.profile=p.data(); if(g.exists)byId.progress=g.data(); if(t.exists)byId["d-"+todayKey()]=t.data(); }
    mode="db";
    const cp=byId.profile, cg=byId.progress, ct=byId["d-"+todayKey()];
    const push=[];
    if(cp||cg){
      cloudSeen=true;
      // profile and progress: newer copy wins; legacy cloud without a stamp wins over a legacy local copy
      if(cp && (cp.updatedAt||0) >= (S.profile.updatedAt||0)){ const keepLang=S.profile.langManual?null:deviceLang(); S.profile=normProfile(cp); if(cp.prayerCheck===undefined) S.profile.prayerCheck=true; if(keepLang && !S.profile.langManual) S.profile.lang=keepLang; } else push.push("profile");
      if(cg && (cg.updatedAt||0) >= (S.progress.updatedAt||0)) S.progress=normProgress(cg); else push.push("progress");
      if(ct){
        const c=normDay(ct), l=S.today;
        // an untouched local day (never edited) simply takes the stored copy; otherwise differing versions are both kept until the user chooses
        if(!(l.updatedAt>0)) S.today=c;
        else if(sameDay(c,l)){ if((c.updatedAt||0)>(l.updatedAt||0)) S.today=c; }
        else if(!(c.updatedAt>0) && !hasContent(c)) push.push("today");
        else { pendingConflict={cloud:c,local:{...l}}; }
      } else if(hasContent(S.today)) push.push("today");
      prevVisit = S.profile.lastVisit;
    } else if(S.profile.onboarded || Object.keys(S.progress.studied).length || hasContent(S.today)){
      push.push("profile","progress","today");
      for(const [k,v] of Object.entries(S.days)) { try{ await coll().doc("d-"+k).set(v); }catch(e){} }
    }
    // legacy scrub: remove prayer/forgiveness marks from stored day docs
    for(const [k,v] of Object.entries(byId)){
      if(k.startsWith("d-") && v && LEGACY_MARKS.some(f=>f in v)){ try{ await coll().doc(k).set(scrub({...v})); }catch(e){} }
    }
    if(push.length){ save(push); } else { syncState="ok"; }
    lsWrite(); stampVisit(); renderAll();
    if(pendingConflict) openConflict();
  }catch(e){ mode="local"; }
}
const sameDay=(a,b)=>["reflect","shukr","niyet","instead","commit","result","lesson"].every(k=>(a[k]||"")===(b[k]||""));
function stampVisit(){ if(S.profile.lastVisit!==todayKey()){S.profile.lastVisit=todayKey();save("profile");} }

function checkDay(){
  const k=todayKey();
  if(S.today.date===k) return false;
  if(mode==="db") flush();
  if(hasContent(S.today)) S.days[S.today.date]=S.today;
  S.today=newDay(); marksLoad();
  prevVisit=S.profile.lastVisit; stampVisit(); lsWrite();
  if(!document.querySelector("#sheet")) renderAll();
  return true;
}
async function checkStale(){
  if(mode!=="db"||!cloudSeen||wiping) return;
  try{ const p=await coll().doc("profile").get(); if(!p.exists){ resetLocal(); toast(T(UI.staleReset)); } }catch(e){}
}
function resetLocal(){
  clearTimeout(saveTimer); saveTimer=null; dirty.clear(); lsDelPrefix();
  const keep=S.profile.lang, man=S.profile.langManual;
  S={profile:{...DEF_PROFILE,lang:keep,langManual:man},progress:DEF_PROGRESS(),today:newDay(),days:{}}; marksLoad(); cloudSeen=false; prevVisit=null;
  closeSheet(); tab="today"; renderAll();
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const lang = () => S.profile.lang==="tr"?"tr":"en";
const T = o => (o && typeof o==="object" && ("tr" in o||"en" in o)) ? (o[lang()] ?? o.en) : o;
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg){const d=document.createElement("div");d.className="toast";d.setAttribute("aria-hidden","true");d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2200);const lv=$("#live");if(lv){lv.textContent="";setTimeout(()=>lv.textContent=msg,30);}}
const star = (filled) => `<svg viewBox="0 0 36 36" aria-hidden="true"><rect x="8" y="8" width="20" height="20" fill="${filled?"var(--accent)":"var(--surface)"}" stroke="var(--accent)" stroke-width="1.6"/><rect x="8" y="8" width="20" height="20" fill="${filled?"var(--accent)":"var(--surface)"}" stroke="var(--accent)" stroke-width="1.6" transform="rotate(45 18 18)"/></svg>`;
const fmtDate = k => { const [y,m,d]=k.split("-").map(Number); return new Intl.DateTimeFormat(lang()==="tr"?"tr-TR":"en-GB",{day:"numeric",month:"short"}).format(new Date(y,m-1,d)); };
const actText = l => (S.profile.lighter && l.pl) ? T(l.pl) : T(l.p);
const practiceText = x => x.id ? (LBY[x.id]?T(LBY[x.id].p):"") : x.text;
// Inside Mevazin, today's act also shows in the Todos tab once you commit to it.
function notifyAct(){
  if(!EMBED || window.parent===window) return;
  const d=S.today, kept=d.kept?S.profile.practices.find(x=>practiceKey(x)===d.kept):null, l=LBY[d.lesson];
  const text=kept?practiceText(kept):(l?actText(l):"");
  try{ window.parent.postMessage({type:"mevazin-yol-act",date:d.date,commit:!!d.commit&&!!text,done:d.result==="did",text},location.origin); }catch(e){}
}
const practiceKey = x => x.id ? "l:"+x.id : "t:"+x.text;
const isKept = id => S.profile.practices.some(x=>x.id===id);

function suggestLesson(){
  const st=S.progress.studied, f=S.profile.focus||[];
  const pool = ORDER.filter(id=>!st[id]);
  if(!pool.length) return null;
  const byLv = arr => [...arr].sort((a,b)=>LBY[a].lv-LBY[b].lv);
  const f1 = pool.find(id=>f.includes(LBY[id].d) && LBY[id].lv===1);
  if(f1) return f1;
  const wf = pool.find(id=>(LBY[id].d==="ibadet"||LBY[id].d==="iman") && LBY[id].lv===1);
  if(wf) return wf;
  const fx = byLv(pool.filter(id=>f.includes(LBY[id].d)))[0];
  return fx || byLv(pool)[0];
}
function revisitLesson(){ const st=S.progress.studied; return Object.keys(st).filter(id=>LBY[id]).sort((a,b)=>st[a]<st[b]?-1:st[a]>st[b]?1:ORDER.indexOf(a)-ORDER.indexOf(b))[0]||ORDER[0]; }
function currentLesson(){
  if(!S.today.lesson || !LBY[S.today.lesson]){ S.today.lesson=suggestLesson()||revisitLesson(); save("today",true); }
  return LBY[S.today.lesson];
}
const allStudied = () => ORDER.every(id=>S.progress.studied[id]);
function weekStats(){
  const s=addDays(todayKey(),-6);
  const a=Object.values(S.progress.studied).filter(d=>d>=s).length;
  const b=Object.entries(S.progress.practice).filter(([d,v])=>d>=s && v && (v.result==="did"||v.result==="part")).length;
  return [a,b];
}
function provenance(row){ const [ref,id,note]=row; return {ref,id,note:note||null,edition:null,passage:null,type:null,scope:null,status:"unverified",support:(row[3]&&row[3].support)||"unchecked"}; }
function evidenceHTML(l){
  return `<div class="evidence"><div class="row" style="justify-content:space-between"><span class="eyebrow">${T(UI.evHead)}</span><span class="tag unv">${lang()==="tr"?"doğrulanmadı":"unverified"}</span></div>${l.ev.map(provenance).map((e,i)=>`<div><b>${esc(e.ref)}</b>${e.id?` · <button type="button" class="libref" data-ref="${l.id}:${i}" aria-expanded="false" aria-label="${esc(e.id+(CAT[e.id]?": "+CAT[e.id][1]:""))}">${e.id}</button>`:""}${e.note?` <span class="small">(${esc(T(e.note))})</span>`:""}<div class="refinfo" id="ri-${l.id}-${i}" hidden>${e.id&&CAT[e.id]?esc(CAT[e.id][1]+" — "+CAT[e.id][2]):""}</div></div>`).join("")}<div class="small muted">${T(UI.evNote)}</div></div>`;
}
const helpCard = () => `<div class="card flat" id="helpCard"><h3>${T(UI.helpTitle)}</h3><p class="small" style="margin-top:4px">${T(UI.helpText)}</p></div>`;

/* recall */
const GAPS=[2,7,30,90];
// a lesson is eligible for Recall only when every claim/source link has passage support recorded as checked (none yet in this pilot)
const supportChecked = l => l.ev.length>0 && l.ev.every(r=>provenance(r).support==="checked");
const anyEligible = () => L.some(supportChecked);
function recallPick(){
  if(!S.profile.recall) return null;
  const t=todayKey(), d=S.today;
  if(d.recallDone) return null;
  if(d.recall && LBY[d.recall]) return d.recall;
  const st=S.progress.studied; let best=null, over=-1;
  for(const id of Object.keys(st)){
    if(!LBY[id] || id===d.lesson || !supportChecked(LBY[id])) continue;
    const n=S.progress.recallN[id]||0, base=S.progress.lastOffered[id]||st[id];
    const gap=GAPS[Math.min(n,GAPS.length-1)], since=daysBetween(base,t);
    if(daysBetween(st[id],t)>=2 && since>=gap && since-gap>over){ over=since-gap; best=id; }
  }
  if(best){ d.recall=best; S.progress.lastOffered[best]=t; S.progress.recallN[best]=(S.progress.recallN[best]||0)+1; save(["today","progress"],true); }
  return best;
}

- If the user asks again for reassurance that their own worship is valid or accepted, begin your reply with the exact marker [[PAUSE]] (it is removed before display), then answer within the rules above. Do not use the marker for ordinary information questions.

async function ask(text){
  text=(text||"").trim(); if(!text||ctl||!S.profile.guideOk) return;
  if(SAMPLE===undefined) await requestSample();
  if(!SAMPLE){ renderGuide(); return; }
  draftQ="";
  chat.push({role:"user",content:text}); chat.push({role:"assistant",content:T(UI.thinking),pending:true});
  renderGuide();
  const btn=$("#askBtn"); ctl=new AbortController();
  if(btn){btn.textContent=T(UI.stop);btn.type="button";btn.onclick=()=>ctl&&ctl.abort();}
  const box=()=>{const msgs=$("#chatBox").querySelectorAll(".msg");return msgs[msgs.length-1];};
  const turns=[{role:"user",content:rules()},...chat.filter(m=>!m.pending).slice(-10).map(m=>({role:m.role,content:m.raw||m.content}))];
  const last=chat[chat.length-1];
  try{
    const {text:ans}=await SAMPLE(turns,{cache:false,signal:ctl.signal,onText:({text})=>{last.content=stripMark(text);const b=box();if(b)b.textContent=last.content;}});
    if(/\[\[PAUSE\]\]/.test(ans)){ pauseCount++; if(pauseCount>=2) pauseShown=true; }
    last.content=stripMark(ans); last.tags=tagIds(last.content); delete last.pending;
  }catch(e){
    const keep=e&&e.text; delete last.pending;
    if(e&&e.code==="not_granted"){ chat.pop(); chat.pop(); draftQ=text; SAMPLE=null; renderGuide(); toast(T(UI.guideDenied)); ctl=null; return; }
    if(!keep && !(e&&e.code==="cancelled")){ chat.pop(); chat.pop(); draftQ=text; ctl=null; renderGuide(); toast(T(UI.guideErr)); return; }
    last.content = keep ? stripMark(keep) : "…";
  }
  ctl=null; renderGuide();
}

function keepPractice(ref){
  const ps=S.profile.practices;
  if(ps.some(x=>practiceKey(x)===practiceKey(ref))) return;
  if(ps.length>=3){ toast(T(UI.full)); return; }

}

function trapTab(e){
  const sh=$("#sheet"); if(!sh||e.key!=="Tab") return;
  const f=[...sh.querySelectorAll('button,input,select,textarea,a[href],summary,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled&&x.offsetParent!==null);
  if(!f.length) return;
  const first=f[0], last=f[f.length-1];
  if(e.shiftKey && (document.activeElement===first||document.activeElement===sh.querySelector(".panel"))){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
}

/* export / import / delete */
async function collectAll(){
  const out={app:"Kurb Yolu",version:2,exported:new Date().toISOString(),profile:S.profile,progress:S.progress,days:{...S.days},incomplete:false};
  if(hasContent(S.today)||S.today.lesson) out.days[S.today.date]=S.today;
  if(pendingConflict) out.unresolved={local:pendingConflict.local,stored:pendingConflict.cloud};
  if(mode==="db"){
    try{ (await listAll()).forEach(d=>{ if(d.id.startsWith("d-")){ const k=d.id.slice(2); const v=scrub({...d.data()}); if(!out.days[k] || (v.updatedAt||0)>(out.days[k].updatedAt||0)) out.days[k]=v; } }); }
    catch(e){ out.incomplete=true; }
  }
  return out;
}
async function exportData(){
  const obj=await collectAll(); const data=JSON.stringify(obj,null,2); const name="kurb-yolu-"+todayKey()+".json";
  try{
    const dl = runtimePresent() ? await window.claude.use("downloads") : null;
    if(dl){ await dl.save({filename:name,data}); toast(T(UI.dlDone)); return; }
  }catch(e){ if(e&&e.code==="cancelled") return; }
  try{
    const url=URL.createObjectURL(new Blob([data],{type:"application/json"}));
    const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000); toast(T(UI.dlDone));
  }catch(e){
    openSheet(`<h2 id="dlT">${T(UI.exportBtn)}</h2><p class="small">${T(UI.dlManual)}</p><textarea readonly style="min-height:220px">${esc(data)}</textarea><button class="btn quiet" type="button" data-close>${T(UI.close)}</button>`,"dlT");
  }
}
let pendingImport=null;
function previewImport(text){
  let o=null; try{ o=JSON.parse(text); }catch(e){}
  const ok = o && o.app==="Kurb Yolu" && o.profile && typeof o.profile==="object" && o.progress && typeof o.progress==="object";
  if(!ok){ toast(T(UI.impBad)); return; }
  const days={...(o.days||{})}; if(o.today && o.today.date) days[o.today.date]=days[o.today.date]||o.today;
  for(const k of Object.keys(days)){ if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||typeof days[k]!=="object") delete days[k]; else days[k]=normDay(days[k]); }
  pendingImport={profile:normProfile(scrub({...o.profile})),progress:normProgress(o.progress),days};
  const nS=Object.keys(pendingImport.progress.studied).length, nD=Object.keys(days).length, when=String(o.exported||"").slice(0,10)||"?";
  openSheet(`<h2 id="impT">${T(UI.impTitle)}</h2><p class="small">${T(UI.impSummary)(nS,nD,esc(when))}</p><div class="row"><button class="btn" type="button" id="impGo">${T(UI.impGo)}</button><button class="btn quiet" type="button" id="impCancel">${T(UI.cancel)}</button></div>`,"impT","#impGo");
}
async function applyImport(){
  const imp=pendingImport; pendingImport=null; if(!imp) return;
  const backup={profile:S.profile,progress:S.progress,today:S.today,days:S.days};
  if(!lsSet(BK,backup)){ closeSheet(); toast(T(UI.snapFail)); return; }
  try{
    const keepLang=S.profile.lang, man=S.profile.langManual;
    S.profile={...imp.profile, lang:man?keepLang:imp.profile.lang, updatedAt:Date.now()};
    S.progress={...imp.progress, updatedAt:Date.now()};
    S.days={...imp.days}; const td=S.days[todayKey()]; delete S.days[todayKey()];
    S.today = td ? {...td,updatedAt:Date.now()} : newDay();
    if(mode==="db"){
      await coll().doc("profile").set(S.profile); await coll().doc("progress").set(S.progress);
      for(const [k,v] of Object.entries(S.days)) await coll().doc("d-"+k).set(v);
      await coll().doc("d-"+S.today.date).set(S.today);
    }
    lsWrite(); try{localStorage.removeItem(BK);}catch(e){}
    closeSheet(); renderAll(); toast(T(UI.impDone));
  }catch(e){
    S.profile=backup.profile; S.progress=backup.progress; S.today=backup.today; S.days=backup.days;
    lsWrite(); if(mode==="db") save(["profile","progress","today"]);
    closeSheet(); renderAll(); toast(T(UI.impFail));
  }
}
async function wipeAll(){
  wiping=true; clearTimeout(saveTimer); saveTimer=null; dirty.clear();
  const keep=S.profile.lang, man=S.profile.langManual;
  let failed=0, unlisted=false;
  if(mode==="db"){
    let ids=null;
    try{ ids=(await listAll()).map(d=>d.id); }catch(e){ unlisted=true; }
    if(!ids) ids=["profile","progress","d-"+S.today.date,...Object.keys(S.days).map(k=>"d-"+k)];
    const res=await Promise.allSettled(ids.map(id=>coll().doc(id).delete()));
    failed=res.filter(r=>r.status==="rejected").length;
  }
  lsDelPrefix(); pendingConflict=null;
  S={profile:{...DEF_PROFILE,lang:keep,langManual:man},progress:DEF_PROGRESS(),today:newDay(),days:{}}; marksLoad(); cloudSeen=false; prevVisit=null;
  closeSheet(); tab="today"; renderAll();
  if(failed){ openSettings(); toast(T(UI.wipePartial)(failed)); wipeArmed=true; const b=$("#wipeBtn"); if(b) b.textContent=T(UI.wipeConfirm); }
  else if(unlisted) toast(T(UI.wipeUnlisted));
  else toast(T(UI.wiped));
  // nothing is written again until the next user action
  const resume=()=>{ wiping=false; document.removeEventListener("pointerdown",resume,true); document.removeEventListener("keydown",resume,true); };
  document.addEventListener("pointerdown",resume,true); document.addEventListener("keydown",resume,true);
}

/* ---------- boot ---------- */
const deviceLang = () => ((navigator.languages&&navigator.languages[0])||navigator.language||"").toLowerCase().startsWith("tr")?"tr":"en";
applyLoaded(lsGet(LSK));
marksLoad();
if(!S.profile.langManual) S.profile.lang = deviceLang();
prevVisit = S.profile.lastVisit;
S.profile.lastVisit = todayKey(); lsWrite();
renderAll();
connect();
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden"){ lsWrite(); flush(); } else { checkDay(); checkStale(); } });
window.addEventListener("focus",()=>checkDay());
window.addEventListener("pagehide",()=>{ lsWrite(); flush(); });
// Mevazin writes this key when it pulls from your account or signs you out; pick that up
// instead of writing the old copy back over it.
window.addEventListener("storage",e=>{
  if(e.key!==LSK && e.key!==null) return;
  const keep=S.profile.lang, man=S.profile.langManual;
  if(e.newValue==null){ pendingConflict=null; S={profile:{...DEF_PROFILE,lang:keep,langManual:man},progress:DEF_PROGRESS(),today:newDay(),days:{}}; marksLoad(); prevVisit=null; }
  else { try{ applyLoaded(JSON.parse(e.newValue)); }catch(_){ return; } if(!S.profile.langManual) S.profile.lang=deviceLang(); }
  renderAll();
});
setInterval(checkDay,60000);
})();
</script>
